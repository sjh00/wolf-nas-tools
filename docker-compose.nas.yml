# 飞牛 OS / Debian NAS 一键启动（前后端 + SQLite，无 Redis/MySQL）
# 1. 把 MEDIA 改成你的媒体盘（飞牛常见 /vol1/1000/store 或 SMB 挂载点）
# 2. docker compose -f docker-compose.nas.yml pull && docker compose -f docker-compose.nas.yml up -d
# 3. 浏览器打开 http://<NAS-IP>:8080   默认 admin / password
#
# 镜像：ghcr.io/sjh00/wolf-nas 、 ghcr.io/sjh00/wolf-nas-web（main 分支自动构建，公开包无需登录）

services:
  frontend:
    image: ghcr.io/sjh00/wolf-nas-web:latest
    container_name: wolfnas-web
    ports:
      - "8080:8080"
    environment:
      BACKEND_HOST: wolfnas
      BACKEND_PORT: "8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - wolfnas-network

  backend:
    image: ghcr.io/sjh00/wolf-nas:latest
    container_name: wolfnas
    hostname: wolfnas
    ports:
      - "3000:8080"
    volumes:
      - ./data:/data
      - ${MEDIA_PATH:-/vol1/1000/store}:/media
    environment:
      PUID: "0"
      PGID: "0"
      UMASK: "000"
      TZ: Asia/Shanghai
      WOLFNAS_DATA: /data
      NEXUS_PORT: "3000"
    restart: unless-stopped
    networks:
      wolfnas-network:
        aliases:
          - backend
    healthcheck:
      test: "wget -qO- http://localhost:8080/health || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

networks:
  wolfnas-network:
    driver: bridge
    name: wolfnas-network
