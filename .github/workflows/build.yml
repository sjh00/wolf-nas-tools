name: WolfNas Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: ci
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PWD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image tags
        id: tags
        run: |
          OWNER="${{ github.repository_owner }}"
          TAGS="ghcr.io/${OWNER}/wolf-nas:latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},ghcr.io/${OWNER}/wolf-nas:${VER}"
          fi
          if [ -n "${DOCKERHUB_USER}" ] && [ -n "${DOCKERHUB_PWD}" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/wolf-nas:latest"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              TAGS="${TAGS},${DOCKERHUB_USER}/wolf-nas:${VER}"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login DockerHub
        if: ${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_PWD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PWD }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    name: Create Release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version and changelog
        id: extract
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

          CONTENT=$(awk '/^## v'"$VERSION"' /{flag=1;next}/^## v/{flag=0}flag' docs/changelog.md)
          if [ -z "$CONTENT" ]; then
            CONTENT="WolfNas $GITHUB_REF_NAME 已发布。"
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CONTENT"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: WolfNas ${{ steps.extract.outputs.tag }}
          body: ${{ steps.extract.outputs.notes }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Telegram notification
        env:
          NOTES: ${{ steps.extract.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes_raw.txt
          python3 scripts/release_notify.py < notes_raw.txt > notes.txt
          {
            echo '<b>WolfNas ${{ steps.extract.outputs.tag }} 已发布</b>'
            echo ''
            cat notes.txt
            echo ''
            echo '📦 Docker: <code>docker pull ghcr.io/sjh00/wolf-nas:latest</code>'
            echo '🔗 <a href="https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract.outputs.tag }}">查看 Release</a>'
          } > telegram_msg.txt

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message_file: telegram_msg.txt
